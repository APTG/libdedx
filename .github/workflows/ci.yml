name: CI

on: [push, pull_request]

# Build/test only: the token needs no more than read access to the checkout.
permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check CMake version
        run: cmake --version

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        if: ${{ runner.os == 'Linux' }}
        run: ctest --test-dir build --output-on-failure

      - name: Run compiled programs on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          ./build/examples/dedx_example
          ./build/examples/dedx_list
          ./build/examples/dedx_use_wrappers
          ./build/examples/dedx_bench_lookup 10000

      - name: Run compiled programs on Windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          ./build/examples/Debug/dedx_example
          ./build/examples/Debug/dedx_list
          ./build/examples/Debug/dedx_bench_lookup 10000

  valgrind:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Valgrind full test suite
        run: .github/scripts/run_valgrind_suite.sh build/tests

  sanitize:
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset sanitize

      - name: Build
        run: cmake --build --preset sanitize --parallel

      - name: Run CTest under ASan+UBSan
        run: ctest --preset sanitize
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  python_tests:
    runs-on: ubuntu-latest
    needs: build_and_test
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Install Python package and dev dependencies
        run: python -m pip install -e "python[dev]"

      - name: Run ruff
        if: ${{ matrix.python-version == '3.13' }}
        working-directory: python
        run: python -m ruff check .

      - name: Run Python tests
        working-directory: python
        env:
          LIBDEDX_SO: ${{ github.workspace }}/build/src/libdedx.so
        run: python -m pytest tests -q
